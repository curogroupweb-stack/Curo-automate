name: Validate CURO Automate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript
        run: node --check app.js
      - name: Check serverless API JavaScript
        run: |
          find api -type f -name '*.js' -print0 | xargs -0 -n1 node --check
